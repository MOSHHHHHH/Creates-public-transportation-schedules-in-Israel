name: Recover blocked Pages deployment
on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write

jobs:
  clear-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clear only known stale failed GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo=os.environ["GH_REPO"]
          sha="efd9c6ed5d8e5a08b77f88535e73e546713cba7c"
          base=f"https://api.github.com/repos/{repo}"
          headers={
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28",
            "User-Agent":"LZM-Maker-Pages-Recovery",
          }
          def api(path, method="GET", payload=None):
            data=None if payload is None else json.dumps(payload).encode()
            req=urllib.request.Request(base+path, data=data, headers=headers, method=method)
            if data: req.add_header("Content-Type","application/json")
            try:
              with urllib.request.urlopen(req, timeout=25) as response:
                raw=response.read()
                return response.status, json.loads(raw) if raw else None
            except urllib.error.HTTPError as exc:
              body=exc.read().decode("utf-8","replace")
              print(f"API {method} {path}: {exc.code} {body[:500]}")
              return exc.code,None
          code,deployments=api("/deployments?sha="+sha+"&per_page=50")
          if code!=200: raise SystemExit("Unable to inspect deployments")
          matching=[d for d in deployments if d.get("sha")==sha and d.get("environment")=="github-pages"]
          print("Matching old Pages deployments:",[(d["id"],d["sha"]) for d in matching])
          for deployment in matching:
            did=deployment["id"]
            code,statuses=api(f"/deployments/{did}/statuses?per_page=10")
            if code!=200: raise SystemExit("Cannot inspect deployment status")
            current=statuses[0].get("state") if statuses else "unknown"
            print("Deployment",did,"current state:",current)
            if current=="success":
              print("Leaving successful deployment intact")
              continue
            if current!="inactive":
              code,_=api(f"/deployments/{did}/statuses","POST",{"state":"inactive","description":"Stale Pages deployment; prior Actions run failed"})
              if code!=201: raise SystemExit("Cannot mark stale deployment inactive")
            code,_=api(f"/deployments/{did}","DELETE")
            if code!=204: raise SystemExit("Cannot delete stale deployment")
            print("Cleared orphaned deployment",did)
          code,details=api("/pages/deployments/"+sha)
          print("Pages status code:",code,"details:",details)
          if code==200 and details and details.get("status") not in ("succeed","deployment_cancelled","cancelled"):
            code,_=api("/pages/deployments/"+sha+"/cancel","POST")
            print("Cancelled lingering Pages deployment:",code)
          PY
