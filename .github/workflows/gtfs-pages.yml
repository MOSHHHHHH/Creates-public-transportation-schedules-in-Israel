name: Build and publish LZM Maker GTFS
# If Pages still publishes the main branch, wait for that deployment to finish
# before publishing the generated GTFS site, to prevent concurrent deployments.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/gtfs-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: lzm-maker-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calendar and 03:00 transport-day behavior
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", src, re.S)
          assert len(scripts) == 1, "Expected exactly one inline script"
          Path("/tmp/lzm-maker-ui.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/lzm-maker-ui.js
      - name: UI regression smoke test
        run: node tests/ui-smoke.cjs
      - name: Build schedules from official daily GTFS
        run: python scripts/build_gtfs.py --output _site
      - name: Include the website
        run: |
          cp index.html _site/index.html
          touch _site/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('_site/data/index.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data['lines']) >= 20, 'Generated dataset is incomplete'
          assert Path('_site/index.html').stat().st_size > 1000
          print('Validated', len(data['lines']), 'available bus numbers')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear specific stale Pages deployment if still locked
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          # GitHub reported this old deployment as blocking newer runs,
          # despite the corresponding workflow already being completed.
          stale_sha = "efd9c6ed5d8e5a08b77f88535e73e546713cba7c"
          endpoint = f"https://api.github.com/repos/{os.environ['REPO']}/pages/deployments/{stale_sha}"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "lzm-maker-stale-pages-cleanup"
          }
          try:
              with urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers), timeout=20) as response:
                  status = response.read().decode("utf-8")
              print("Old Pages deployment status:", status)
              if '"status":"succeed"' in status.replace(" ", ""):
                  print("Old deployment completed; not canceling.")
                  raise SystemExit(0)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("No stale deployment found.")
                  raise SystemExit(0)
              raise
          req = urllib.request.Request(endpoint + "/cancel", headers=headers, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print("Old deployment cancel request:", response.status)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("Old deployment already cleared.")
              else:
                  print("Cannot cancel stale deployment:", e.code, e.read().decode("utf-8")[:500])
          PY
      - name: Wait for built-in Pages branch deployment on push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["REPO"]
          sha = os.environ["TARGET_SHA"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "lzm-maker-deployment-coordination",
          }
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=50"
          # The native branch deployment appears soon after a push, but can be delayed.
          for attempt in range(75):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      runs = json.load(response).get("workflow_runs", [])
                  native = [run for run in runs if run.get("name") == "pages build and deployment"]
                  if native and all(run.get("status") == "completed" for run in native):
                      print("Built-in Pages deployment finished. Starting GTFS Pages deployment.", flush=True)
                      break
                  print(f"Waiting for branch Pages deployment ({attempt+1}/75)...", flush=True)
              except Exception as error:
                  print("Pages status check failed; retrying:", error, flush=True)
              time.sleep(15)
          else:
              raise SystemExit("Built-in Pages deployment did not finish; refusing conflicting deploy")
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
